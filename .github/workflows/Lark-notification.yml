name: Lark notification

# https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows
on:
  push:
  issues:
  pull_request:
  discussion:
  issue_comment:
  discussion_comment:
  release:
    types:
      - published

jobs:
  send-Lark-message:
    runs-on: ubuntu-latest
    env:
      LARK_CHATBOT_HOOK_URL: ${{ secrets.LARK_CHATBOT_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.LARK_CHATBOT_HOOK_URL != ''

      - uses: actions/setup-node@v4
        if: env.LARK_CHATBOT_HOOK_URL != ''
        with:
          node-version-file: '.nvmrc'

      - name: Event Message serialization
        id: message
        if: env.LARK_CHATBOT_HOOK_URL != ''
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: |
          content=$(printf '%s' "$GITHUB_CONTEXT" | node --experimental-strip-types .github/scripts/transform-message.ts)
          printf 'content=%s\n' "$content" >> "$GITHUB_OUTPUT"

      - name: Send message to Lark
        if: env.LARK_CHATBOT_HOOK_URL != '' && steps.message.outputs.content != ''
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.LARK_CHATBOT_HOOK_URL }}
          msg_type: post
          content: |
            ${{ steps.message.outputs.content }}
